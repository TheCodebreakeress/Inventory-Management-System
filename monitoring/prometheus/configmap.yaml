apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: inventory
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "inventory-backend"
        metrics_path: "/metrics"
        static_configs:
          - targets:
              - "inventory-backend.inventory.svc.cluster.local:8000"